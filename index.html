<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polaroid Photobooth</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
        }

        h1 { margin-bottom: 10px; }
        p { margin-bottom: 30px; color: #bdc3c7; text-align: center; }

        /* Viewfinder styling */
        .viewfinder {
            background: #000;
            border: 10px solid #34495e;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        video {
            display: block;
            width: 400px;
            height: 300px;
            object-fit: cover;
            transform: scaleX(-1);
            transition: filter 0.3s ease;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        button, .download-btn, select {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-family: inherit;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s, transform 0.1s;
        }
        
        select {
            background-color: #34495e;
            border: 2px solid #e74c3c;
            outline: none;
        }

        button:hover, .download-btn:hover { background-color: #c0392b; }
        select:hover { background-color: #2c3e50; }
        button:active, .download-btn:active { transform: scale(0.95); }
        button:disabled { background-color: #7f8c8d; cursor: not-allowed; }

        /* Hidden canvas */
        canvas { display: none; }

        /* Final Display Image */
        #finalResult {
            display: none;
            max-width: 90%;
            height: auto;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            margin-bottom: 30px;
            transform: rotate(2deg);
        }

        /* Camera flash */
        #flash {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s ease-out;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="flash"></div>

    <h1>📸 Digital Photobooth</h1>
    <p>Grant camera access, pick a filter, take 3 photos, and download your strip!</p>

    <div class="viewfinder" id="viewfinderWrapper">
        <video id="videoFeed" autoplay playsinline></video>
    </div>

    <img id="finalResult" alt="Your Polaroid Strip" />

    <div class="controls">
        <button id="startBtn">Start Camera</button>
        
        <select id="filterSelect">
            <option value="none">Normal</option>
            <option value="vintage">Vintage Sepia</option>
            <option value="bw">High Contrast B&W</option>
            <option value="faded">Faded Memory</option>
            <option value="cool">Cool Tone</option>
        </select>

        <button id="captureBtn" disabled>Capture (0/3)</button>
        <a id="downloadBtn" class="download-btn" style="display: none;">Download Polaroid</a>
    </div>

    <button id="resetBtn" style="display: none;">Take New Photos</button>

    <canvas id="renderCanvas"></canvas>

    <script>
        const video = document.getElementById('videoFeed');
        const startBtn = document.getElementById('startBtn');
        const captureBtn = document.getElementById('captureBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const filterSelect = document.getElementById('filterSelect');
        const renderCanvas = document.getElementById('renderCanvas');
        const finalResult = document.getElementById('finalResult');
        const viewfinderWrapper = document.getElementById('viewfinderWrapper');
        const flash = document.getElementById('flash');
        const ctx = renderCanvas.getContext('2d');

        let stream = null;
        let capturedImages = [];
        const MAX_PHOTOS = 3;

        // Using percentages for strict cross-browser compatibility
        const filters = {
            'none': 'none',
            'vintage': 'sepia(80%) contrast(120%) brightness(90%) hue-rotate(-15deg)',
            'bw': 'grayscale(100%) contrast(150%) brightness(110%)',
            'faded': 'brightness(120%) contrast(80%) saturate(60%)',
            'cool': 'contrast(110%) saturate(130%) hue-rotate(15deg)'
        };

        // Live update video feed
        filterSelect.addEventListener('change', (e) => {
            video.style.filter = filters[e.target.value];
        });

        // Start Camera
        startBtn.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480 } 
                });
                video.srcObject = stream;
                startBtn.style.display = 'none';
                captureBtn.disabled = false;
            } catch (err) {
                alert("Camera access denied. Run on a local server (localhost).");
                console.error(err);
            }
        });

        // Capture Photo
        captureBtn.addEventListener('click', () => {
            if (capturedImages.length >= MAX_PHOTOS) return;

            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; }, 100);

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth;
            tempCanvas.height = video.videoHeight;
            const tempCtx = tempCanvas.getContext('2d');
            
            tempCtx.translate(tempCanvas.width, 0);
            tempCtx.scale(-1, 1);
            
            // Grab raw video frame
            tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
            capturedImages.push(tempCanvas.toDataURL('image/jpeg', 1.0));

            captureBtn.innerText = `Capture (${capturedImages.length}/${MAX_PHOTOS})`;

            if (capturedImages.length === MAX_PHOTOS) {
                finishSession();
            }
        });

        // Stop camera and build strip
        function finishSession() {
            captureBtn.style.display = 'none';
            viewfinderWrapper.style.display = 'none';
            
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            buildPolaroid();
        }

        // Build the final polaroid using Promises to prevent rendering bugs
        async function buildPolaroid() {
            const pWidth = 400; 
            const pPadding = 20; 
            const pSpacing = 15; 
            const pBottom = 100; 
            
            const imgWidth = pWidth - (pPadding * 2);
            const imgHeight = imgWidth * 0.75; 
            const pHeight = pPadding + (imgHeight * 3) + (pSpacing * 2) + pBottom;

            renderCanvas.width = pWidth;
            renderCanvas.height = pHeight;

            // 1. Draw white background
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, pWidth, pHeight);

            // 2. Safely wait for all 3 images to load into memory
            const loadedImages = await Promise.all(capturedImages.map(src => {
                return new Promise(resolve => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.src = src;
                });
            }));

            // 3. Lock in the filter and draw all 3 images
            ctx.filter = filters[filterSelect.value];
            loadedImages.forEach((img, index) => {
                const yPos = pPadding + (index * (imgHeight + pSpacing));
                ctx.drawImage(img, pPadding, yPos, imgWidth, imgHeight);
            });

            // 4. Remove filter securely before drawing text
            ctx.filter = 'none';
            ctx.fillStyle = "#333333";
            ctx.font = "bold 20px 'Courier New'";
            ctx.textAlign = "center";
            
            const today = new Date().toLocaleDateString();
            ctx.fillText(today, renderCanvas.width / 2, renderCanvas.height - 40);

            // 5. Output image
            const finalDataURL = renderCanvas.toDataURL('image/jpeg', 0.9);
            
            finalResult.src = finalDataURL;
            finalResult.style.display = 'block';

            downloadBtn.href = finalDataURL;
            downloadBtn.download = `polaroid_strip_${Date.now()}.jpg`;
            downloadBtn.style.display = 'inline-block';
            
            resetBtn.style.display = 'inline-block';
        }

        // Reset
        resetBtn.addEventListener('click', () => {
            capturedImages = [];
            finalResult.style.display = 'none';
            downloadBtn.style.display = 'none';
            resetBtn.style.display = 'none';
            viewfinderWrapper.style.display = 'block';
            
            captureBtn.style.display = 'inline-block';
            captureBtn.innerText = `Capture (0/3)`;
            captureBtn.disabled = true;
            startBtn.style.display = 'inline-block';
            
            video.style.filter = filters[filterSelect.value];
        });
    </script>
</body>
</html>
