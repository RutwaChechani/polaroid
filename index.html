<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polaroid Photobooth</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            margin-bottom: 30px;
            color: #bdc3c7;
        }

        /* Viewfinder styling */
        .viewfinder {
            background: #000;
            border: 10px solid #34495e;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        video {
            display: block;
            width: 400px;
            height: 300px;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror the camera */
        }

        /* Buttons */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        button, .download-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-family: inherit;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover, .download-btn:hover {
            background-color: #c0392b;
        }

        button:active, .download-btn:active {
            transform: scale(0.95);
        }

        button:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
        }

        /* The hidden canvas used to draw the final image */
        canvas {
            display: none;
        }

        /* The final display image */
        #finalResult {
            display: none;
            max-width: 90%;
            height: auto;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            margin-bottom: 30px;
            transform: rotate(2deg); /* Slight messy angle */
        }

        /* Camera flash effect */
        #flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s ease-out;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="flash"></div>

    <h1>📸 Digital Photobooth</h1>
    <p>Grant camera access, take 3 photos, and download your Polaroid strip!</p>

    <div class="viewfinder" id="viewfinderWrapper">
        <video id="videoFeed" autoplay playsinline></video>
    </div>

    <img id="finalResult" alt="Your Polaroid Strip" />

    <div class="controls">
        <button id="startBtn">Start Camera</button>
        <button id="captureBtn" disabled>Capture (0/3)</button>
        <a id="downloadBtn" class="download-btn" style="display: none;">Download Polaroid</a>
    </div>

    <button id="resetBtn" style="display: none;">Take New Photos</button>

    <canvas id="renderCanvas"></canvas>

    <script>
        const video = document.getElementById('videoFeed');
        const startBtn = document.getElementById('startBtn');
        const captureBtn = document.getElementById('captureBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const renderCanvas = document.getElementById('renderCanvas');
        const finalResult = document.getElementById('finalResult');
        const viewfinderWrapper = document.getElementById('viewfinderWrapper');
        const flash = document.getElementById('flash');
        const ctx = renderCanvas.getContext('2d');

        let stream = null;
        let capturedImages = [];
        const MAX_PHOTOS = 3;

        // Start Camera
        startBtn.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480 } 
                });
                video.srcObject = stream;
                startBtn.style.display = 'none';
                captureBtn.disabled = false;
            } catch (err) {
                alert("Camera access denied or unavailable. Please ensure you are running this on a secure server (localhost or https).");
                console.error(err);
            }
        });

        // Capture Photo
        captureBtn.addEventListener('click', () => {
            if (capturedImages.length >= MAX_PHOTOS) return;

            // Trigger flash effect
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; }, 100);

            // Create a temporary canvas to grab the current video frame
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth;
            tempCanvas.height = video.videoHeight;
            const tempCtx = tempCanvas.getContext('2d');
            
            // Mirror the image to match the video feed
            tempCtx.translate(tempCanvas.width, 0);
            tempCtx.scale(-1, 1);
            tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);

            // Save image data
            capturedImages.push(tempCanvas.toDataURL('image/jpeg', 0.9));

            // Update UI
            captureBtn.innerText = `Capture (${capturedImages.length}/${MAX_PHOTOS})`;

            // If 3 photos are taken, process the polaroid
            if (capturedImages.length === MAX_PHOTOS) {
                finishSession();
            }
        });

        // Generate the final polaroid and stop the camera
        function finishSession() {
            captureBtn.style.display = 'none';
            viewfinderWrapper.style.display = 'none';
            
            // Stop video tracks to turn off the webcam light
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            buildPolaroid();
        }

        // Draw the photos onto a canvas styled like a Polaroid strip
        function buildPolaroid() {
            // Define Polaroid layout dimensions
            const pWidth = 400; // Total width
            const pPadding = 20; // Edge padding
            const pSpacing = 15; // Space between photos
            const pBottom = 100; // Large bottom margin for classic polaroid look
            
            const imgWidth = pWidth - (pPadding * 2);
            // Assuming 4:3 aspect ratio from camera
            const imgHeight = imgWidth * 0.75; 

            // Calculate total canvas height
            const pHeight = pPadding + (imgHeight * 3) + (pSpacing * 2) + pBottom;

            renderCanvas.width = pWidth;
            renderCanvas.height = pHeight;

            // 1. Draw white background
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, pWidth, pHeight);

            // 2. Load and draw all 3 images
            let loadedCount = 0;
            const imgElements = capturedImages.map(src => {
                const img = new Image();
                img.src = src;
                return img;
            });

            imgElements.forEach((img, index) => {
                img.onload = () => {
                    // Apply a slight vintage filter to the canvas context
                    ctx.filter = 'contrast(1.1) sepia(0.2) brightness(0.9)';
                    
                    const yPos = pPadding + (index * (imgHeight + pSpacing));
                    ctx.drawImage(img, pPadding, yPos, imgWidth, imgHeight);
                    
                    loadedCount++;
                    if (loadedCount === MAX_PHOTOS) {
                        finalizeImage();
                    }
                };
            });
        }

        // Export canvas to image and setup download link
        function finalizeImage() {
            // Reset filter and add some text at the bottom
            ctx.filter = 'none';
            ctx.fillStyle = "#333333";
            ctx.font = "bold 20px 'Courier New'";
            ctx.textAlign = "center";
            
            // Date formatting
            const today = new Date().toLocaleDateString();
            ctx.fillText(today, renderCanvas.width / 2, renderCanvas.height - 40);

            // Convert canvas to a downloadable image
            const finalDataURL = renderCanvas.toDataURL('image/jpeg', 0.9);
            
            finalResult.src = finalDataURL;
            finalResult.style.display = 'block';

            downloadBtn.href = finalDataURL;
            downloadBtn.download = `polaroid_strip_${Date.now()}.jpg`;
            downloadBtn.style.display = 'inline-block';
            
            resetBtn.style.display = 'inline-block';
        }

        // Reset the application to take new photos
        resetBtn.addEventListener('click', () => {
            capturedImages = [];
            finalResult.style.display = 'none';
            downloadBtn.style.display = 'none';
            resetBtn.style.display = 'none';
            viewfinderWrapper.style.display = 'block';
            
            captureBtn.style.display = 'inline-block';
            captureBtn.innerText = `Capture (0/3)`;
            captureBtn.disabled = true;
            
            startBtn.style.display = 'inline-block';
        });
    </script>
</body>
</html>
